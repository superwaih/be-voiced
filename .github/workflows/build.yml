# Installers for both platforms, built on GitHub's runners.
#
# A macOS app cannot be produced on Windows: the bundle needs macOS tooling and macOS sidecars. Run
# this workflow instead and download the artifacts.
#
# Neither build is signed with a paid certificate. The macOS app is ad-hoc signed ("-"), which costs
# nothing and is what lets it run at all on Apple Silicon, but it is not notarized: the first launch
# needs the Gatekeeper step in README.md. Add APPLE_SIGNING_IDENTITY and notarization secrets later
# to turn this into a clean install without touching the rest of the workflow.
name: Build installers

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            label: macos-universal
            target: universal-apple-darwin
          - os: windows-latest
            label: windows-x64
            target: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target == 'universal-apple-darwin' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - run: pnpm install --frozen-lockfile

      # FFmpeg, ffprobe, yt-dlp and whisper-cli for this target. whisper.cpp is compiled from source,
      # so this is the slow step; the Rust cache does not cover it. On macOS each binary is ad-hoc
      # signed as it is installed, including the lipo'd universal ones.
      - name: Fetch and build sidecars
        run: pnpm -C apps/desktop sidecars ${{ matrix.target && format('--target {0}', matrix.target) || '' }}

      - name: Build app
        env:
          # Ad-hoc identity. No Apple Developer account, no certificate, no keychain.
          APPLE_SIGNING_IDENTITY: "-"
        run: pnpm -C apps/desktop tauri build ${{ matrix.target && format('--target {0}', matrix.target) || '' }}

      # Seal the bundle ourselves as well: Tauri's own signing step is one version change away from
      # behaving differently, and an unsigned bundle is refused outright by Apple Silicon.
      - name: Sign and package (macOS)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          BUNDLE="apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle"
          APP="$(find "$BUNDLE/macos" -maxdepth 1 -name '*.app' | head -1)"
          test -n "$APP" || { echo "No .app was produced"; exit 1; }
          echo "Signing $APP"
          # Nested executables first: a bundle's seal covers its contents, so anything signed after
          # the outer signature invalidates it.
          find "$APP/Contents/MacOS" -type f -perm +111 -print -exec codesign --force --sign - --timestamp=none {} \;
          codesign --force --sign - --timestamp=none --entitlements apps/desktop/src-tauri/entitlements.plist "$APP"
          codesign --verify --strict --verbose=2 "$APP"
          codesign --display --verbose=2 "$APP" 2>&1 | head -8
          # ditto keeps symlinks, permissions and the signature intact; `zip` does not.
          ditto -c -k --sequesterRsrc --keepParent "$APP" "be-voiced-macos-universal.zip"
          ls -la "$BUNDLE/dmg" || true

      - uses: actions/upload-artifact@v4
        with:
          name: be-voiced-${{ matrix.label }}
          if-no-files-found: error
          path: |
            be-voiced-macos-universal.zip
            apps/desktop/src-tauri/target/**/release/bundle/dmg/*.dmg
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe

  # Artifacts live on the run page, behind a login, and expire. A tagged build also gets a release,
  # which is a permanent public link you can hand to someone.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect installers
        run: |
          set -euo pipefail
          mkdir -p release
          # Artifacts keep their build paths; the release wants a flat list of installers.
          find artifacts -type f \( -name '*.dmg' -o -name '*.zip' -o -name '*.msi' -o -name '*.exe' \) \
            -exec cp -n {} release/ \;
          ls -la release
          test -n "$(ls -A release)" || { echo "No installers to publish"; exit 1; }

      - name: Write release notes
        run: |
          cat > notes.md <<'NOTES'
          ## Install

          **Windows** — run the `.exe` (or `.msi`). SmartScreen warns because the build is not signed with a
          paid certificate: choose **More info → Run anyway**.

          **macOS** — open the `.dmg` and drag Be Voiced to Applications, or unzip the `.zip` into Applications.
          The app is ad-hoc signed but not notarized, so the first launch is refused. Open
          **System Settings → Privacy & Security** and choose **Open Anyway**. One command does the same:

          ```
          xattr -dr com.apple.quarantine "/Applications/Be Voiced.app"
          ```

          The macOS build is universal (Apple Silicon and Intel). FFmpeg, yt-dlp and whisper.cpp ship inside
          the app; pick and download a Whisper model in Settings before transcribing locally.
          NOTES

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$GITHUB_REF_NAME" release/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "Be Voiced $GITHUB_REF_NAME" \
              --notes-file notes.md
          fi
