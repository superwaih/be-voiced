<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#431047"/>
      <stop offset="1" stop-color="#250828"/>
    </linearGradient>
  </defs>
  <!-- 824px tile on a 1024px canvas: the macOS icon grid; Windows scales it cleanly. -->
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#tile)"/>
  <rect x="100.5" y="100.5" width="823" height="823" rx="185.5" fill="none" stroke="#E9D7EC" stroke-opacity="0.18"/>
  <g>
    <rect x="258" y="433" width="84" height="158" rx="42" fill="#B375BA"/>
    <rect x="384" y="300" width="84" height="424" rx="42" fill="#EFE2F1"/>
