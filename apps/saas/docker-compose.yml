# The local stack: the two services the app needs that are not the app.
#
# Postgres holds the data and the job queue — pg-boss keeps its jobs as rows in the same database,
# so enqueuing a job and saving the recording it belongs to happen in one transaction.
#
# MinIO stands in for Cloudflare R2. Same S3 API, so the only difference in production is the
# endpoint and the keys.
#
#   docker compose up -d
#   pnpm db:migrate

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: bevoiced
      POSTGRES_PASSWORD: bevoiced
      POSTGRES_DB: bevoiced
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bevoiced"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: bevoiced
      MINIO_ROOT_PASSWORD: bevoiced123
    ports: ["9000:9000", "9001:9001"]
    volumes: ["miniodata:/data"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Creates the bucket once, then exits.
  minio-setup:
    image: minio/mc:latest
    depends_on:
      minio: { condition: service_healthy }
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 bevoiced bevoiced123 &&
      mc mb --ignore-existing local/recordings &&
      echo 'bucket ready'
      "

volumes:
  pgdata:
  miniodata:
